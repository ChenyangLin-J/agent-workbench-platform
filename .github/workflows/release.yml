name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full 40-character tested Platform commit SHA to promote
        required: true
        type: string
      acceptance_evidence:
        description: agent-workbench.consumer-acceptance-set/v1 JSON bound to this Platform SHA
        required: true
        type: string
      impact_override:
        description: Optional comma-separated consumer override, or none
        required: false
        type: string
      impact_reason:
        description: Required when impact_override is set
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate immutable candidate ref
        env:
          RELEASE_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          if [[ ! "${RELEASE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Release ref must be a full 40-character commit SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_REF,,}" ]]; then
            echo "Checked-out commit does not match the requested candidate." >&2
            exit 1
          fi
      - name: Classify consumer impact
        id: consumer-impact
        env:
          CONSUMER_IMPACT_OVERRIDE: ${{ inputs.impact_override }}
          CONSUMER_IMPACT_REASON: ${{ inputs.impact_reason }}
        shell: bash
        run: |
          base="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [[ -z "${base}" ]]; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          node .github/scripts/consumer-impact.mjs \
            --base "${base}" \
            --head HEAD \
            --github-output "${GITHUB_OUTPUT}" \
            --github-summary "${GITHUB_STEP_SUMMARY}"
      - name: Validate consumer acceptance
        id: consumer-acceptance
        env:
          CONSUMER_ACCEPTANCE_REQUIRED: ${{ steps.consumer-impact.outputs.consumers }}
          CONSUMER_ACCEPTANCE_EVIDENCE: ${{ inputs.acceptance_evidence }}
          CONSUMER_ACCEPTANCE_CANDIDATE: ${{ inputs.ref }}
        run: node .github/scripts/consumer-impact.mjs --validate-acceptance --github-output "${GITHUB_OUTPUT}"
      - name: Validate version and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_CONSUMERS: ${{ steps.consumer-acceptance.outputs.accepted_consumers }}
          ACCEPTANCE_EVIDENCE: ${{ steps.consumer-acceptance.outputs.evidence_reference }}
          REQUIRED_CONSUMERS: ${{ steps.consumer-impact.outputs.consumers }}
        shell: bash
        run: |
          target_commit="$(git rev-parse HEAD)"
          git fetch origin main --tags
          if ! git merge-base --is-ancestor "${target_commit}" origin/main; then
            echo "Release target ${target_commit} is not reachable from origin/main." >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "${tag}")"
            if [[ "${tagged_commit}" != "${target_commit}" ]]; then
              echo "${tag} already points to ${tagged_commit}; refusing to move it to ${target_commit}." >&2
              exit 1
            fi
            echo "${tag} already points to the selected candidate."
            gh release view "${tag}" >/dev/null 2>&1 || \
              gh release create "${tag}" --title "${tag}" --generate-notes
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          required_consumers="${REQUIRED_CONSUMERS:-platform-only}"
          git tag -a "${tag}" \
            -m "${tag}" \
            -m "Candidate: ${target_commit}" \
            -m "Required consumers: ${required_consumers}" \
            -m "Accepted consumers: ${ACCEPTED_CONSUMERS}" \
            -m "Acceptance evidence: ${ACCEPTANCE_EVIDENCE}"
          git push origin "${tag}"
          gh release create "${tag}" --title "${tag}" --generate-notes
